# ============================================================================
#  Azure DevOps Pipeline — Manage On-Prem Gateway Connections with Key Vault
#
#  This pipeline:
#    1. Authenticates to the Fabric API using a service principal
#    2. Creates or updates on-premises gateway connections
#    3. Uses Azure Key Vault secret references (no plaintext secrets in requests)
#
#  Prerequisites:
#    - An Azure DevOps Service Connection (Azure Resource Manager) linked to
#      the subscription containing your Key Vault.
#    - A Variable Group linked to Key Vault with the relevant secrets.
#    - Fabric tenant setting "Service principals can use Fabric APIs" enabled.
#    - A Key Vault connection already configured in Fabric.
# ============================================================================

trigger: none   # Run manually or on a schedule

schedules:
  - cron: "0 6 * * 1"            # Every Monday at 06:00 UTC
    displayName: "Weekly on-prem gateway connection check"
    branches:
      include:
        - main
    always: true

parameters:
  - name: action
    displayName: "Action to perform"
    type: string
    default: "UpdateOnPremGateway"
    values:
      - CreateOnPremGateway
      - UpdateOnPremGateway

  - name: connectionId
    displayName: "Existing Connection ID (for update action)"
    type: string
    default: ""

  - name: gatewayId
    displayName: "Gateway ID (required)"
    type: string
    default: ""

  - name: keyVaultConnectionId
    displayName: "Fabric Key Vault Connection ID"
    type: string
    default: ""

  - name: keyVaultSecretName
    displayName: "Key Vault Secret Name (SPN secret)"
    type: string
    default: ""

  - name: keyVaultSecretVersion
    displayName: "Key Vault Secret Version (optional, blank for latest)"
    type: string
    default: ""

  - name: skipTestConnection
    displayName: "Skip test connection?"
    type: boolean
    default: false

variables:
  # Link a Variable Group that pulls secrets from Azure Key Vault
  - group: "FabricSecrets"
  # Expected secrets in the group:
  #   FabricSpnTenantId       — tenant of the SPN that authenticates to Fabric
  #   FabricSpnClientId       — client ID of the SPN that authenticates to Fabric
  #   FabricSpnClientSecret   — client secret of the SPN that authenticates to Fabric
  #   DataSourceSpnClientId   — client ID of the SPN used in the data connection
  #   DataSourceSpnTenantId   — tenant ID of the SPN used in the data connection

  # Non-secret variables
  - name: displayName
    value: "My-Automated-Connection"
  - name: serverName
    value: "myserver.database.windows.net"
  - name: databaseName
    value: "mydatabase"

pool:
  vmImage: "windows-latest"     # PowerShell 7 is pre-installed

steps:
  - task: AzurePowerShell@5
    displayName: "Manage on-prem gateway connection with Key Vault reference"
    inputs:
      azureSubscription: "MyAzureServiceConnection"   # your service connection name
      ScriptType: "FilePath"
      ScriptPath: "$(Build.SourcesDirectory)/Manage-FabricGatewayConnections.ps1"
      ScriptArguments: >-
        -TenantId "$(FabricSpnTenantId)"
        -ClientId "$(FabricSpnClientId)"
        -ClientSecret "$(FabricSpnClientSecret)"
        -DataSourceSpnClientId "$(DataSourceSpnClientId)"
        -DataSourceSpnTenantId "$(DataSourceSpnTenantId)"
        -KeyVaultConnectionId "${{ parameters.keyVaultConnectionId }}"
        -KeyVaultSecretName "${{ parameters.keyVaultSecretName }}"
        -KeyVaultSecretVersion "${{ parameters.keyVaultSecretVersion }}"
        -ConnectionId "${{ parameters.connectionId }}"
        -GatewayId "${{ parameters.gatewayId }}"
        -DisplayName "$(displayName)"
        -ServerName "$(serverName)"
        -DatabaseName "$(databaseName)"
        -Action "${{ parameters.action }}"
        -SkipTestConnection $${{ parameters.skipTestConnection }}
      azurePowerShellVersion: "LatestVersion"
      pwsh: true
