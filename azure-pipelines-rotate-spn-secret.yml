# ============================================================================
#  Azure DevOps Pipeline — Rotate Service Principal Secret on Fabric Connections
#
#  This pipeline:
#    1. Retrieves the NEW SPN secret from Azure Key Vault
#    2. Authenticates to the Fabric API using a service principal
#    3. Updates the specified connection(s) with the new secret
#
#  Prerequisites:
#    - An Azure DevOps Service Connection (Azure Resource Manager) linked to
#      the subscription containing your Key Vault.
#    - A Variable Group linked to Key Vault with the relevant secrets.
#    - Fabric tenant setting "Service principals can use Fabric APIs" enabled.
# ============================================================================

trigger: none   # Run manually or on a schedule

schedules:
  - cron: "0 6 * * 1"            # Every Monday at 06:00 UTC
    displayName: "Weekly SPN secret rotation check"
    branches:
      include:
        - main
    always: true

parameters:
  - name: action
    displayName: "Action to perform"
    type: string
    default: "UpdateCloud"
    values:
      - CreateCloud
      - UpdateCloud
      - CreateOnPremGateway
      - UpdateOnPremGateway

  - name: connectionId
    displayName: "Existing Connection ID (for update actions)"
    type: string
    default: ""

  - name: gatewayId
    displayName: "Gateway ID (for on-prem actions)"
    type: string
    default: ""

  - name: skipTestConnection
    displayName: "Skip test connection?"
    type: boolean
    default: false

variables:
  # Link a Variable Group that pulls secrets from Azure Key Vault
  - group: "FabricSecrets"
  # Expected secrets in the group:
  #   FabricSpnTenantId       — tenant of the SPN that authenticates to Fabric
  #   FabricSpnClientId       — client ID of the SPN that authenticates to Fabric
  #   FabricSpnClientSecret   — client secret of the SPN that authenticates to Fabric
  #   DataSourceSpnClientId   — client ID of the SPN used in the data connection
  #   DataSourceSpnTenantId   — tenant ID of the SPN used in the data connection
  #   DataSourceSpnNewSecret  — the NEW rotated secret for the data-source SPN

  # Non-secret variables
  - name: displayName
    value: "My-Automated-Connection"
  - name: serverName
    value: "myserver.database.windows.net"
  - name: databaseName
    value: "mydatabase"

pool:
  vmImage: "windows-latest"     # PowerShell 7 is pre-installed

steps:
  # -----------------------------------------------------------------------
  #  OPTION A: Use AzurePowerShell task (recommended for Azure DevOps)
  #  This authenticates via Service Connection automatically.
  # -----------------------------------------------------------------------
  - task: AzurePowerShell@5
    displayName: "Rotate SPN secret on Fabric connection"
    inputs:
      azureSubscription: "MyAzureServiceConnection"   # your service connection name
      ScriptType: "FilePath"
      ScriptPath: "$(Build.SourcesDirectory)/scripts/Manage-FabricGatewayConnections.ps1"
      ScriptArguments: >-
        -TenantId "$(FabricSpnTenantId)"
        -ClientId "$(FabricSpnClientId)"
        -ClientSecret "$(FabricSpnClientSecret)"
        -DataSourceSpnClientId "$(DataSourceSpnClientId)"
        -DataSourceSpnTenantId "$(DataSourceSpnTenantId)"
        -DataSourceSpnSecret "$(DataSourceSpnNewSecret)"
        -ConnectionId "${{ parameters.connectionId }}"
        -GatewayId "${{ parameters.gatewayId }}"
        -DisplayName "$(displayName)"
        -ServerName "$(serverName)"
        -DatabaseName "$(databaseName)"
        -Action "${{ parameters.action }}"
        -SkipTestConnection $${{ parameters.skipTestConnection }}
      azurePowerShellVersion: "LatestVersion"
      pwsh: true

