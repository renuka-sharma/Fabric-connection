# ============================================================================
#  Azure DevOps Pipeline — Manage On-Prem Gateway Connections
#
#  This pipeline:
#    1. Retrieves the data-source SPN secret from Azure Key Vault (via variable group)
#    2. Authenticates to the Fabric API using an automation service principal
#    3. Creates or updates on-premises gateway connections with encrypted credentials
#
#  The secret is RSA-OAEP encrypted before being sent to the Fabric API —
#  it never appears in plain text in API request bodies.
#
#  Prerequisites:
#    - An Azure DevOps Service Connection (Azure Resource Manager) linked to
#      the subscription containing your Key Vault.
#    - A Variable Group linked to Key Vault with the relevant secrets.
#    - Fabric tenant setting "Service principals can use Fabric APIs" enabled.
#    - The automation SPN must have permissions on the on-premises gateway.
# ============================================================================

trigger: none   # Run manually or on a schedule

schedules:
  - cron: "0 6 * * 1"            # Every Monday at 06:00 UTC
    displayName: "Weekly on-prem gateway connection check"
    branches:
      include:
        - main
    always: true

parameters:
  - name: action
    displayName: "Action to perform"
    type: string
    default: "UpdateOnPremGateway"
    values:
      - CreateOnPremGateway
      - UpdateOnPremGateway

  - name: connectionId
    displayName: "Existing Connection ID (required for UpdateOnPremGateway)"
    type: string
    default: ""

  - name: gatewayId
    displayName: "Gateway ID (required for both actions)"
    type: string
    default: ""

  - name: displayName
    displayName: "Connection display name"
    type: string
    default: "Automated-SPN-Connection"

  - name: serverName
    displayName: "SQL Server name"
    type: string
    default: ""

  - name: databaseName
    displayName: "Database name"
    type: string
    default: ""

  - name: skipTestConnection
    displayName: "Skip test connection?"
    type: boolean
    default: false

variables:
  # Link a Variable Group that pulls secrets from Azure Key Vault
  - group: "FabricSecrets"
  # Expected secrets in the group:
  #   FabricSpnTenantId       — tenant of the SPN that authenticates to Fabric
  #   FabricSpnClientId       — client ID of the SPN that authenticates to Fabric
  #   FabricSpnClientSecret   — client secret of the SPN that authenticates to Fabric
  #   DataSourceSpnClientId   — client ID of the SPN used in the data connection
  #   DataSourceSpnTenantId   — tenant ID of the SPN used in the data connection
  #   DataSourceSpnNewSecret  — the current valid secret for the data-source SPN
  #                             (rotated in Key Vault before this pipeline runs)

pool:
  vmImage: "windows-latest"     # PowerShell 7 is pre-installed

steps:
  # -------------------------------------------------------------------------
  #  Validate required parameters before running the main script
  # -------------------------------------------------------------------------
  - task: PowerShell@2
    displayName: "Validate required parameters"
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $action = '${{ parameters.action }}'
        $connectionId = '${{ parameters.connectionId }}'
        $gatewayId = '${{ parameters.gatewayId }}'
        $serverName = '${{ parameters.serverName }}'
        $databaseName = '${{ parameters.databaseName }}'

        $errors = @()

        if ([string]::IsNullOrWhiteSpace($gatewayId)) {
            $errors += "gatewayId is required for all actions"
        }

        if ($action -eq 'UpdateOnPremGateway' -and [string]::IsNullOrWhiteSpace($connectionId)) {
            $errors += "connectionId is required for UpdateOnPremGateway action"
        }

        if ($action -eq 'CreateOnPremGateway') {
            if ([string]::IsNullOrWhiteSpace($serverName)) {
                $errors += "serverName is required for CreateOnPremGateway action"
            }
            if ([string]::IsNullOrWhiteSpace($databaseName)) {
                $errors += "databaseName is required for CreateOnPremGateway action"
            }
        }

        if ($errors.Count -gt 0) {
            foreach ($err in $errors) {
                Write-Error $err
            }
            exit 1
        }

        Write-Host "Parameter validation passed."
        Write-Host "  Action: $action"
        Write-Host "  GatewayId: $gatewayId"
        if ($connectionId) { Write-Host "  ConnectionId: $connectionId" }
        if ($serverName) { Write-Host "  ServerName: $serverName" }
        if ($databaseName) { Write-Host "  DatabaseName: $databaseName" }

  # -------------------------------------------------------------------------
  #  Run the PowerShell script to create/update the gateway connection
  # -------------------------------------------------------------------------
  - task: AzurePowerShell@5
    displayName: "Manage on-prem gateway connection"
    inputs:
      # TODO: Replace with your actual Azure DevOps service connection name
      azureSubscription: "<YOUR-AZURE-SERVICE-CONNECTION>"
      ScriptType: "FilePath"
      ScriptPath: "$(Build.SourcesDirectory)/Manage-FabricGatewayConnections.ps1"
      ScriptArguments: >-
        -TenantId "$(FabricSpnTenantId)"
        -ClientId "$(FabricSpnClientId)"
        -ClientSecret "$(FabricSpnClientSecret)"
        -DataSourceSpnClientId "$(DataSourceSpnClientId)"
        -DataSourceSpnTenantId "$(DataSourceSpnTenantId)"
        -DataSourceSpnSecret "$(DataSourceSpnNewSecret)"
        -ConnectionId "${{ parameters.connectionId }}"
        -GatewayId "${{ parameters.gatewayId }}"
        -DisplayName "${{ parameters.displayName }}"
        -ServerName "${{ parameters.serverName }}"
        -DatabaseName "${{ parameters.databaseName }}"
        -Action "${{ parameters.action }}"
        -SkipTestConnection $${{ parameters.skipTestConnection }}
      azurePowerShellVersion: "LatestVersion"
      pwsh: true
